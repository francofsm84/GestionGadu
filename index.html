<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GADU Construye · Tu gestión perfecta</title>
<link rel="icon" type="image/png" href="logo-32.png?v=4">
<link rel="apple-touch-icon" href="logo-192.png?v=4">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <a class="logo" href="#/dashboard">
        <span class="logo-box">
          <img class="logo-img-light" src="logo.png?v=3" alt="GADU Construye · Tu gestión perfecta">
          <img class="logo-img-dark" src="logo-dark.png?v=3" alt="GADU Construye · Tu gestión perfecta">
        </span>
        <span class="logo-slogan">Tu gestión, perfecta</span>
      </a>
      <button type="button" class="icon-btn sidebar-close" id="sidebarClose" aria-label="Cerrar menú"><span data-icon="x"></span></button>
    </div>
    <nav class="nav">
      <a class="nav-link" href="#/dashboard" data-route="dashboard"><span class="nav-ico" data-icon="grid"></span><span class="nav-label">Dashboard</span></a>
      <a class="nav-link" href="#/agenda" data-route="agenda"><span class="nav-ico" data-icon="book"></span><span class="nav-label">Agenda</span></a>

      <div class="nav-group" data-group="obras">
        <button type="button" class="nav-group-head">
          <span class="nav-ico" data-icon="hard-hat"></span><span class="nav-label">Obras</span>
          <span class="badge badge-info" id="badgeObras" hidden>0</span><span class="nav-chev" aria-hidden="true"></span>
        </button>
        <div class="nav-group-body"><div class="nav-group-inner">
          <a class="nav-link" href="#/obras" data-route="obras"><span class="nav-ico" data-icon="hard-hat"></span><span class="nav-label">Todas las obras</span></a>
          <a class="nav-link" href="#/presupuestos" data-route="presupuestos"><span class="nav-ico" data-icon="file-text"></span><span class="nav-label">Presupuestos</span></a>
        </div></div>
      </div>

      <div class="nav-group" data-group="contabilidad">
        <button type="button" class="nav-group-head">
          <span class="nav-ico" data-icon="receipt"></span><span class="nav-label">Contabilidad</span><span class="nav-chev" aria-hidden="true"></span>
        </button>
        <div class="nav-group-body"><div class="nav-group-inner">
          <a class="nav-link" href="#/ingresos" data-route="ingresos"><span class="nav-ico" data-icon="trending-up"></span><span class="nav-label">Ingresos</span></a>
          <a class="nav-link" href="#/gastos" data-route="gastos"><span class="nav-ico" data-icon="receipt"></span><span class="nav-label">Gastos</span></a>
        </div></div>
      </div>

      <div class="nav-group" data-group="personal">
        <button type="button" class="nav-group-head">
          <span class="nav-ico" data-icon="users"></span><span class="nav-label">Personal</span><span class="nav-chev" aria-hidden="true"></span>
        </button>
        <div class="nav-group-body"><div class="nav-group-inner">
          <a class="nav-link" href="#/empleados" data-route="empleados"><span class="nav-ico" data-icon="user"></span><span class="nav-label">Empleados</span></a>
          <a class="nav-link" href="#/socios" data-route="socios"><span class="nav-ico" data-icon="users"></span><span class="nav-label">Socios y reparto</span><span class="badge badge-danger" id="badgeLiquidaciones" hidden>0</span></a>
          <a class="nav-link" href="#/clientes" data-route="clientes"><span class="nav-ico" data-icon="briefcase"></span><span class="nav-label">Clientes</span></a>
        </div></div>
      </div>

      <div class="nav-group" data-group="recursos">
        <button type="button" class="nav-group-head">
          <span class="nav-ico" data-icon="wrench"></span><span class="nav-label">Recursos</span><span class="nav-chev" aria-hidden="true"></span>
        </button>
        <div class="nav-group-body"><div class="nav-group-inner">
          <a class="nav-link" href="#/herramientas" data-route="herramientas"><span class="nav-ico" data-icon="wrench"></span><span class="nav-label">Herramientas</span></a>
          <a class="nav-link" href="#/seguros" data-route="seguros"><span class="nav-ico" data-icon="shield"></span><span class="nav-label">Seguros y vencimientos</span><span class="badge badge-danger" id="badgeSeguros" hidden>0</span></a>
        </div></div>
      </div>

      <a class="nav-link" href="#/admin" data-route="admin" id="navAdmin" hidden><span class="nav-ico" data-icon="settings"></span><span class="nav-label">Administración</span></a>
      <button class="nav-link nav-btn" id="btnBackup"><span class="nav-ico" data-icon="database"></span><span class="nav-label">Respaldos y datos</span></button>
    </nav>
    <div class="sidebar-foot">
      <button type="button" class="nav-link nav-btn" id="btnCollapse"><span class="nav-ico" data-icon="chevrons-left"></span><span class="nav-label">Colapsar menú</span></button>
    </div>
  </aside>

  <div class="backdrop" id="backdrop"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn btn-menu" id="btnMenu" aria-label="Abrir menú"><span data-icon="menu"></span></button>
      <div class="topbar-title">
        <h1 id="pageTitle">Panel general</h1>
        <p id="pageSubtitle"></p>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn btn-more" id="btnMore" aria-label="Abrir asistente" title="Abrir asistente"><span data-icon="plus"></span></button>
        <span class="sync-indicator" id="syncSpinner" hidden title="Sincronizando…"></span>
        <button class="chip chip-info" id="planChip" hidden title="Ver mi suscripción"></button>
        <button class="btn btn-soft btn-sm" id="btnUser" title="Mi cuenta" hidden></button>
        <button class="icon-btn" id="btnTheme" aria-label="Cambiar tema" title="Cambiar tema"></button>
      </div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="js/store.js"></script>
<script src="js/auth.js"></script>
<script src="js/sync.js"></script>
<script src="js/plan.js"></script>
<script src="js/ui.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/obras.js"></script>
<script src="js/views/obra-detalle.js"></script>
<script src="js/views/presupuestos.js"></script>
<script src="js/views/ingresos.js"></script>
<script src="js/views/gastos.js"></script>
<script src="js/views/socios.js"></script>
<script src="js/views/seguros.js"></script>
<script src="js/views/empleados.js"></script>
<script src="js/views/clientes.js"></script>
<script src="js/views/herramientas.js"></script>
<script src="js/views/agenda.js"></script>
<script src="js/views/admin.js"></script>
<script src="js/ai.js"></script>
</body>
</html>
