name: Keep Supabase alive

# Mantiene el proyecto de Supabase activo para que no entre en pausa por inactividad.
# Hace un GET diario a la API REST (tabla "planes", de lectura pública).

on:
  schedule:
    - cron: '0 0 * * *'   # todos los días a las 00:00 UTC
  workflow_dispatch:       # permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a la base de datos de Supabase
        run: |
          curl -sS -f -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/planes?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null
          echo "✅ Ping a Supabase completado correctamente"
