<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Prueba de carga GADU</title>
<style>
body{background:#001a00;font-family:Arial;padding:24px}
.marca{font-size:22px;font-weight:bold;padding:14px;border-radius:10px;margin:8px 0}
</style>
</head>
<body>
<h1 style="color:#fff;font-size:26px">PRUEBA DE CARGA DE ARCHIVOS</h1>
<div id="panel"></div>
<script>
function marca(texto, color){var d=document.createElement('div');d.className='marca';d.style.background=color;d.style.color='#000';d.textContent=texto;document.getElementById('panel').appendChild(d);}
marca('MARCA 0 · JavaScript inline funciona','#00ff00');
window.onerror=function(m,s,l){marca('ERROR DETECTADO: '+m+' (línea '+l+')','#ff0000');};
</script>
<link rel="stylesheet" href="css/styles.css" onload="marca('MARCA 1 · css/styles.css CARGO BIEN','#00ff00')" onerror="marca('MARCA 1 · css/styles.css FALLO','#ff0000')">
<script src="js/store.js" onload="marca('MARCA 2 · js/store.js CARGO BIEN','#00ff00')" onerror="marca('MARCA 2 · js/store.js FALLO','#ff0000')"></script>
<script src="js/app.js" onload="marca('MARCA 3 · js/app.js CARGO BIEN','#00ff00')" onerror="marca('MARCA 3 · js/app.js FALLO','#ff0000')"></script>
<script>
setTimeout(function(){
  if(document.getElementById('panel').children.length<4){marca('A LOS 6 SEGUNDOS SIGO ESPERANDO ARCHIVOS…','#ff9900');}
},6000);
</script>
</body>
</html>
