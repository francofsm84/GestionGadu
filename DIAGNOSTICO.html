<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Diagnóstico GADU</title>
<style>body{background:#1a3a6b;color:#fff;font-family:Arial;padding:30px;font-size:18px;line-height:2}</style>
</head>
<body>
<h1>PRUEBA DE TU NAVEGADOR</h1>
<p id="t1">PASO 1: Si ves fondo AZUL y este texto, tu navegador dibuja HTML/CSS normal.</p>
<p id="t2">PASO 2: esperando…</p>
<script>
document.getElementById('t1').style.background='#0a5c2e';
document.getElementById('t2').textContent='PASO 2 OK: JavaScript funciona (el texto de arriba quedó con fondo verde).';
var l=document.createElement('link');l.rel='stylesheet';l.href='css/styles.css';
l.onload=function(){document.getElementById('t2').textContent+=' · PASO 3 OK: el CSS de la app (styles.css) carga bien.';};
l.onerror=function(){document.getElementById('t2').textContent+=' · PASO 3 FALLA: styles.css NO cargó.';};
document.head.appendChild(l);
var s=document.createElement('script');s.src='js/store.js';
s.onload=function(){document.getElementById('t2').textContent+=' · PASO 4 OK: los scripts de la app cargan.';};
s.onerror=function(){document.getElementById('t2').textContent+=' · PASO 4 FALLA: los scripts de la app NO cargan.';};
document.head.appendChild(s);
</script>
</body>
</html>
